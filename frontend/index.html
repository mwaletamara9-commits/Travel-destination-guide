<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Destination Guide - Q6</title>
<style>
body { font-family: Arial; padding: 20px; max-width: 900px; margin: auto; }
input { padding: 8px; margin: 5px; width: 200px; }
button { padding: 8px 15px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
</style>
</head>
<body>
<h1>Travel Destination Guide</h1>

<div>
<input id="name" placeholder="Destination Name (e.g. Paris)">
<input id="category" placeholder="Category - beach, city, mountain">
<input id="country" placeholder="Country">
<input id="imageUrl" placeholder="Image URL">
<input id="description" placeholder="Description">
<button onclick="addDestination()">Add Destination</button>
</div>

<h2 id="count">All Destinations (0)</h2>

<table>
<thead>
<tr><th>ID</th><th>Name</th><th>Category</th><th>Country</th><th>Action</th></tr>
</thead>
<tbody id="destinationList">
</tbody>
</table>

<script src="app.js"></script>
</body>
</html>
